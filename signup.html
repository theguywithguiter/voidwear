<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your VOIDWEAR account." />
  <title>Create account — VOIDWEAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="signup">
  <div id="site-header"></div>
  <main class="auth-page container">
    <section class="auth-card">
      <p class="eyebrow">Join VOIDWEAR</p>
      <h1>Create account.</h1>
      <p class="auth-card__intro">Save your details for a faster checkout and stay close to the next drop.</p>
      <form class="auth-form" id="signup-form">
        <div class="form-field"><label for="signup-name">Full name</label><input id="signup-name" name="name" type="text" autocomplete="name" required /></div>
        <div class="form-field"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required /></div>
        <div class="form-field"><label for="signup-password">Password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required /><span>At least 6 characters</span></div>
        <div class="form-field"><label for="signup-confirm-password">Confirm password</label><input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required /></div>
        <p class="form-status" aria-live="polite"></p>
        <button class="button button--light auth-submit" type="submit">Create account <span>↗</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      <p class="auth-note">This frontend demo keeps account details only in this browser.</p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
