<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Log in to your VOIDWEAR account." />
  <title>Log in — VOIDWEAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="login">
  <div id="site-header"></div>
  <main class="auth-page container">
    <section class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in.</h1>
      <p class="auth-card__intro">Pick up where you left off. Your saved bag is waiting.</p>
      <form class="auth-form" id="login-form">
        <div class="form-field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" autocomplete="email" required /></div>
        <div class="form-field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required /></div>
        <p class="form-status" aria-live="polite"></p>
        <button class="button button--light auth-submit" type="submit">Log in <span>↗</span></button>
      </form>
      <p class="auth-switch">New to VOIDWEAR? <a href="signup.html">Create an account</a></p>
      <p class="auth-note">Accounts created here are stored only on this device.</p>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="app.js"></script>
</body>
</html>
